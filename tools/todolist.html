<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo by Date</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      margin-top: 50px;
    }

    .container {
      width: 400px;
    }

    h1 {
      text-align: center;
    }

    .input-box {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
    }

    input, button {
      padding: 10px;
      border: none;
      border-radius: 5px;
    }

    input {
      flex: 1;
    }

    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }

    .date-group {
      margin-bottom: 20px;
    }

    .task {
      display: flex;
      justify-content: space-between;
      background: #1e293b;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Todo List</h1>

  <div class="input-box">
    <input type="text" id="taskInput" placeholder="Enter task">
    <input type="date" id="dateInput">
    <button onclick="addTask()">Add</button>
  </div>

  <div id="taskList"></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
  // 🔥 PASTE YOUR FIREBASE CONFIG HERE
  const firebaseConfig = {
    apiKey:"AIzaSyACEG_4v-3ROgMNOlFZsAllC9VcYb8Nm2A",
  authDomain:"bcd-discord.firebaseapp.com",
  projectId:"bcd-discord",
  storageBucket:"bcd-discord.appspot.com",
  messagingSenderId:"278895155371",
  appId:"1:278895155371:web:177a468f5fa3f0abfe3fee"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const taskInput = document.getElementById("taskInput");
  const dateInput = document.getElementById("dateInput");
  const taskList = document.getElementById("taskList");

  function addTask() {
    const task = taskInput.value.trim();
    const date = dateInput.value;

    if (!task || !date) {
      alert("Enter task and date");
      return;
    }

    db.collection("tasks").add({
      text: task,
      date: date,
      created: Date.now()
    });

    taskInput.value = "";
  }

  function deleteTask(id) {
    db.collection("tasks").doc(id).delete();
  }

  db.collection("tasks").orderBy("date").onSnapshot(snapshot => {
    taskList.innerHTML = "";
    let grouped = {};

    snapshot.forEach(doc => {
      const data = doc.data();
      const id = doc.id;

      if (!grouped[data.date]) grouped[data.date] = [];
      grouped[data.date].push({ ...data, id });
    });

    for (let date in grouped) {
      const groupDiv = document.createElement("div");
      groupDiv.className = "date-group";

      const title = document.createElement("h3");
      title.textContent = date;
      groupDiv.appendChild(title);

      grouped[date].forEach(task => {
        const taskDiv = document.createElement("div");
        taskDiv.className = "task";

        taskDiv.innerHTML = `
          <span>${task.text}</span>
          <button onclick="deleteTask('${task.id}')">X</button>
        `;

        groupDiv.appendChild(taskDiv);
      });

      taskList.appendChild(groupDiv);
    }
  });
</script>

</body>
</html>
